# Newsdesk sources.
#
# tier   1 = wire/primary, 2 = quality outlet, 3 = regional/specialist, 4 = unvetted
# category  optional. A feed with one obvious topic declares it here. Used ONLY
#           when no keyword in categories.toml matches. Keywords always win.
# kind   news (default) | report — report feeds go to the Reports tab
# region world | europe | spain  — a fallback only; the real region comes from
#                                  the countries found in the story text.
#
# Rule: if adding a feed wouldn't change a decision you'd make, leave it out.

# ─────────────────────────────── World ───────────────────────────────

[[feed]]
name = "Reuters"
url = "https://news.google.com/rss/search?q=when:2d+source:Reuters&hl=en-US&gl=US&ceid=US:en"
tier = 1
region = "world"

