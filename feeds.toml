# ────────────────────────── EU institutions ──────────────────────────
# Eurostat's own RSS (statistics-update.rss) is a machine feed — ~250 items
# a day of "Dataset: updated data". Useless as news. This picks up coverage
# of their actual releases instead. The raw indicator values belong in the
# Monitor tab as a data layer, not here as stories.

[[feed]]
name = "Eurostat"
url = "https://news.google.com/rss/search?q=Eurostat+when:7d&hl=en-US&gl=US&ceid=US:en"
tier = 1
region = "europe"
category = "economic-finance"

# ─────────────────── Social apps and channels · tier 4 ───────────────
# Hidden when the Sources filter is set to News only. See D15.
#
# Telegram goes through the public RSS-Bridge instance, which puts a third
# party in the path — if rss-bridge.org is down, these are down. Self-host
# it on the Pi to remove that.

[[feed]]
name = "Bellingcat (TG)"
url = "https://rss-bridge.org/bridge01/?action=display&bridge=TelegramBridge&username=bellingcat&format=Atom"
tier = 4
region = "world"

[[feed]]
name = "Ukraine NOW (TG)"
url = "https://rss-bridge.org/bridge01/?action=display&bridge=TelegramBridge&username=ukrainenowenglish&format=Atom"
tier = 4
region = "europe"

[[feed]]
name = "Bellingcat (Bsky)"
url = "https://bsky.app/profile/bellingcat.com/rss"
tier = 4
region = "world"

[[feed]]
name = "#ukraine (Mastodon)"
url = "https://mastodon.social/tags/ukraine.rss"
tier = 4
region = "europe"

[[feed]]
name = "#osint (Mastodon)"
url = "https://mastodon.social/tags/osint.rss"
tier = 4
region = "world"

# ────────────────────────────── Reports ──────────────────────────────
# kind = "report" moves a feed out of the News tab and into Reports.
# Slow, considered pieces. A few items a week each, so they lose on
# recency against 875 daily stories and need their own surface. See D16.
#
# Crisis Group was here and is gone: its only feed is a CMS dump with
# titles like "Washington 27 August 2026 #3" and an author username
# leaking into the summary. Nothing usable without a source-specific hack.

[[feed]]
name = "Bellingcat"
url = "https://www.bellingcat.com/feed/"
tier = 2
region = "world"
kind = "report"

[[feed]]
name = "ECFR"
url = "https://ecfr.eu/feed/"
