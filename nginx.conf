# Serves the page and the data files the 05:00 refresh writes. Everything
# else in the folder — scripts, configs, refresh.log — answers 404.
server {
    listen 80;
    root /srv/newsdesk;
    server_tokens off;

    # Browser security headers live in security-headers.conf and are included
    # in every location: a location's own add_header drops server-level ones.

    # data.js is several MB of text; compressed it is a fraction of that.
    gzip on;
    gzip_types application/javascript text/css application/manifest+json image/svg+xml;

    location = / {
        try_files /index.html =404;
        include /srv/newsdesk/security-headers.conf;
    }

    # Always revalidate, so the phone picks up this morning's data.
    location ~ ^/[\w.-]+\.(html|css|js|webmanifest)$ {
        add_header Cache-Control "no-cache";
        include /srv/newsdesk/security-headers.conf;
    }

    location ~ ^/icons/[\w.-]+\.(png|svg)$ {
        add_header Cache-Control "max-age=86400";
        include /srv/newsdesk/security-headers.conf;
    }

    location / {
        include /srv/newsdesk/security-headers.conf;
        return 404;
    }
}
