<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newsdesk</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="bar">
    <h1>Newsdesk</h1>
    <p id="meta"></p>
  </div>

  <nav id="tabs" class="tabs" aria-label="Sections"></nav>

  <div id="feed-controls">
    <div class="category-row only-feed">
      <nav id="cats" class="cats only-feed" aria-label="Category"></nav>
      <label class="field home-country-field">
        <span>Home country</span>
        <select id="home-country" aria-describedby="home-country-hint"></select>
      </label>
      <p id="home-country-hint">Sets your country news category. Topic categories stay the same.</p>
    </div>

    <div class="subfilters">
      <label class="field">
        <span>Region</span>
        <select id="region"></select>
      </label>

      <label class="field">
        <span>Country</span>
        <select id="country"></select>
      </label>

      <div class="field">
        <span>Period</span>
        <div id="time" class="seg" role="group" aria-label="Time window"></div>
      </div>

      <div class="field only-feed">
        <span>Sources</span>
        <div id="sources" class="seg" role="group" aria-label="Source trust"></div>
      </div>

      <div class="field">
        <span>Show</span>
        <div id="view" class="seg" role="group" aria-label="Read state"></div>
      </div>

      <div class="field only-feed">
        <span>Per load</span>
        <div id="batch" class="seg" role="group" aria-label="Batch size"></div>
      </div>

      <button id="reset" class="reset" type="button">Reset</button>
    </div>
  </div>
</header>

<main>
  <section id="panel-summary" hidden>
    <div id="brief"></div>
  </section>

  <section id="panel-feed">
    <div id="list"></div>
    <p id="end"></p>
  </section>

  <section id="panel-reports" hidden>
    <div id="reports"></div>
  </section>

  <section id="panel-markets" hidden>
    <div class="market-bar">
      <div class="field">
        <span>Window</span>
        <div id="window" class="seg" role="group" aria-label="Timeframe"></div>
      </div>
      <label class="field">
        <span>Market</span>
        <select id="market"></select>
      </label>
      <div class="field">
        <span>Show</span>
        <div id="kind" class="seg" role="group" aria-label="Indices or stocks"></div>
      </div>
    </div>
    <div id="rows"></div>
  </section>

  <section id="panel-data" hidden>
    <div id="tiles"></div>
  </section>
</main>

<!-- Loaded as scripts, not fetched: fetch() is blocked on file:// URLs. See D7. -->
<script src="data.js"></script>
<script src="indicators.js"></script>
<script src="markets.js"></script>
<script src="summary.js"></script>
<script src="app.js"></script>

</body>
</html>
