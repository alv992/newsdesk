<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<title>Newsdesk</title>
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" href="icons/icon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Newsdesk">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="bar">
    <h1>Newsdesk</h1>
    <p id="meta"></p>
    <button id="filters-toggle" class="filters-toggle" type="button"
            aria-controls="feed-controls" aria-expanded="false">Filters</button>
  </div>

  <nav id="tabs" class="tabs" aria-label="Sections"></nav>

  <div id="feed-controls">
    <div class="category-row only-feed">
      <nav id="cats" class="cats only-feed" aria-label="Category"></nav>
      <label class="field home-country-field">
        <span>Home country</span>
        <select id="home-country" aria-describedby="home-country-hint"></select>
      </label>
      <p id="home-country-hint">Sets your country news category. Topic categories stay the same.</p>
    </div>

    <div class="subfilters">
      <label class="field">
        <span>Region</span>
        <select id="region"></select>
      </label>

      <label class="field">
        <span>Country</span>
        <select id="country"></select>
      </label>

      <div class="field">
        <span>Period</span>
        <div id="time" class="seg" role="group" aria-label="Time window"></div>
      </div>

      <div class="field only-feed">
        <span>Sources</span>
        <div id="sources" class="seg" role="group" aria-label="Source trust"></div>
      </div>

      <div class="field">
        <span>Show</span>
        <div id="view" class="seg" role="group" aria-label="Read state"></div>
      </div>

      <div class="field only-feed">
        <span>Per load</span>
        <div id="batch" class="seg" role="group" aria-label="Batch size"></div>
      </div>

      <button id="reset" class="reset" type="button">Reset</button>
    </div>
  </div>
</header>

<main>
  <section id="panel-summary" hidden>
    <div id="brief"></div>
  </section>

  <section id="panel-feed">
    <div id="list"></div>
    <p id="end"></p>
  </section>

  <section id="panel-map" hidden>
    <div class="market-bar">
      <div class="field">
        <span>Period</span>
        <div id="map-time" class="seg" role="group" aria-label="Time window"></div>
      </div>
      <div class="field map-legend" aria-label="Stories per country">
        <span>Stories</span>
        <div>
          <span class="map-swatch t0">⣿</span> none
          <span class="map-swatch t1">⣿</span> 1–2
          <span class="map-swatch t2">⣿</span> 3–9
          <span class="map-swatch t3">⣿</span> 10–29
          <span class="map-swatch t4">⣿</span> 30+
        </div>
      </div>
    </div>
    <div id="map" role="img" aria-label="World map shaded by how many stories mention each country. The list below gives the same counts."></div>
    <p id="map-pick" class="map-pick" hidden></p>
    <div id="map-list" class="map-list"></div>
  </section>

  <section id="panel-reports" hidden>
    <div id="reports"></div>
  </section>

  <section id="panel-markets" hidden>
    <div class="market-bar">
      <div class="field">
        <span>Window</span>
        <div id="window" class="seg" role="group" aria-label="Timeframe"></div>
      </div>
      <label class="field">
        <span>Market</span>
        <select id="market"></select>
      </label>
      <div class="field">
        <span>Show</span>
        <div id="kind" class="seg" role="group" aria-label="Indices or stocks"></div>
      </div>
    </div>
    <div id="rows"></div>
  </section>

  <section id="panel-data" hidden>
    <div id="tiles"></div>
  </section>
</main>

<!-- Loaded as scripts, not fetched: fetch() is blocked on file:// URLs. See D7. -->
<script src="data.js"></script>
<script src="indicators.js"></script>
<script src="markets.js"></script>
<script src="summary.js"></script>
<script src="worldmap.js"></script>
<script src="app.js"></script>

</body>
</html>
