# Included in every location of nginx.conf. `always` keeps them on 404s too.
# The page loads only its own files (no inline scripts or styles, no
# third-party requests), so 'self' is all the policy needs to allow.
add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
