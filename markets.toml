# Symbols are Yahoo format. Exchange suffixes:
#   US none · Spain .MC · Germany .DE · France .PA · Italy .MI
#   Sweden .ST · UK .L · Japan .T · India .NS · Singapore .SI · HK .HK
#
# Indices are listed under [market.<id>.index], constituents under .stocks.
# A symbol that fails is logged and skipped — prune it here when it does.
#
# STOCK ORDER IS THE RANKING: largest by market capitalisation first. Yahoo
# no longer exposes market cap on any keyless endpoint, so this is curated
# by hand. It drifts — worth re-checking once or twice a year.
#
# markets.py keeps the first 35 stocks per market and ignores the rest.

